# ProMOC User Configuration
#
# Copy this file to `user_config.yaml` and adjust the values for your CS setup.
# The runtime only needs a small set of keys and keeps everything else optional.

runtime:
  mode: hardware

measurement:
  operator: YourName
  base_path: ~/Dokumente/Messungen

camera:
  pixel_size_um: 2.40

autofocus:
  refinement_samples: 51
  min_step_mm: 0.01
  refinement_shrink_factor: 0.25

fly_over:
  refinement_mode: 0
  refinement_strategy: linear

measurement_conditions:
  coaxial_light_voltage: 0.0
  coaxial_light_current: 0.0
  camera_objective: unknown
  notes: ""
