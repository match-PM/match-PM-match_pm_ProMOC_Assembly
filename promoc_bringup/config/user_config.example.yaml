# ProMOC User Configuration
#
# Copy this file to `user_config.yaml` and adjust the values for the local user.
# This is the only maintained user-config template on the messstand branch.
# MTF exports will be written below:
#   <measurement.base_path>/<measurement.operator>/mtf_messungen/<run_id>/

runtime:
  mode: hardware

measurement:
  operator: YourName
  base_path: ~/Dokumente/Messungen

camera:
  # Available profiles are listed in config/cameras/README.md.
  profile: ids_u3_3800cp_m_gl_r22
  # Optional expert override. Normally omit this so the profile's sensor
  # pixel size is used for MTF frequencies.
  # pixel_size_um: 2.40

# Camera/objective-specific scale and quality limits for EstimateTargetTilt.
# The example values match IDS U3-3800CP-C-HQ + Myutron FTV30-150 at 3x.
target_tilt:
  # Runtime hierarchy: node defaults < this imaging profile < values below.
  imaging_profile: ids_u3_3800cp_c_hq_myutron_ftv30_150_3x
  magnification: 3.0
  object_um_per_pixel: 0.8
  # auto_texture (default), manual_bbox or fixed_grid
  roi_selection_mode: auto_texture
  manual_target_bbox: [0.0, 0.0, 1.0, 1.0]
  candidate_roi_width_fraction: 0.08
  candidate_roi_height_fraction: 0.08
  candidate_step_x_fraction: 0.06
  candidate_step_y_fraction: 0.06
  minimum_structured_pixel_fraction: 0.01
  minimum_target_coverage_fraction: 0.05
  minimum_baseline_x_mm: 0.25
  minimum_baseline_y_mm: 0.25
  minimum_spatial_bins_x: 3
  minimum_spatial_bins_y: 3
  minimum_selected_rois: 10
  maximum_selected_rois: 30
  roi_rows: 7
  roi_cols: 7
  focus_metric: tenengrad
  peak_fit_method: quadratic
  surface_weighted: false
  surface_robust: true
  # Diagnostic mode retains only scalar per-frame ROI scores, never images.
  evaluation_enabled: false
  # true exports hundreds of curves and is intended only for deep debugging.
  evaluation_export_all_focus_curves: false
  evaluation_focus_metrics: []  # modified_laplacian, variance_laplacian
  evaluation_output_directory: ~/Dokumente/Messungen/tilt_evaluation
  bootstrap_iterations: 0
  reference_surface_path: ""
  diagnostic_image_enabled: false
  settle_time_s: 0.15
  axis_timeout_s: 30.0
  image_timeout_s: 2.0
  repeatability_x_deg: 0.002
  repeatability_y_deg: 0.002
  tolerance_x_deg: 0.05
  tolerance_y_deg: 0.05

autofocus:
  refinement_samples: 51
  min_step_mm: 0.01
  refinement_shrink_factor: 0.25
  analysis_roi_x_px: -1
  analysis_roi_y_px: -1
  analysis_roi_width_px: 2048
  analysis_roi_height_px: 2048
  analysis_downsample_max_dim_px: 2048
  analysis_use_center_roi: true

auto_exposure:
  # Median of segmented white plateau (P95 fallback) targets 70% of raw range.
  target_level_fraction: 0.70
  tolerance_fraction: 0.02
  percentile: 95.0
  max_saturated_fraction: 0.001
  saturation_threshold_fraction: 0.98
  clipping_level_fraction: 0.95
  frames_per_iteration: 3
  max_iterations: 10
  stable_iterations: 2
  settle_frames_after_set: 2

fly_over:
  refinement_mode: 0
  refinement_strategy: linear

mtf:
  profile: default
  # The maintained default profile is already conservative against strong
  # overshoot and keeps warnings/export diagnostics visible.
  debug_export_dir: ""
  use_raw_capture: true
  capture_required_raw: true
  # 0 keeps the exposure selected through /promoc/camera/set_exposure.
  # Set a positive value in microseconds only when MTF must force a fixed exposure.
  capture_exposure_us: 0.0
  min_edge_angle: 2.0
  max_edge_angle: 11.0
  capture_only_samples: 10
  capture_only_timeout_s: 1.0
  capture_only_context_margin_px: 64
  capture_only_save_fullframe_raw: true
  capture_only_preview_png: true

measurement_conditions:
  # Can be overridden without editing this file:
  # ros2 launch promoc_bringup optical_measurement_system.launch.py objective:=1x
  camera_objective: 1x
  notes: ""
