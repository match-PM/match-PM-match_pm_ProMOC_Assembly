lts300_z_axis:
  ros__parameters:
    debug_mode: false
    serial_number: '45407924'
    collision_threshold: 200.0
    device_units_per_mm: 409600.0
    max_position: 300.0 
    min_position: 0.0 
    max_single_move: 300.0
    homing_timeout: 180.0  # 3 minutes for long homing operations
    jog_step_size: 1.0  # Default jog step size in mm
    jog_speed: 10.0  # Default jog speed in mm/s
    max_velocity: 5.0  # Default max velocity in mm/s
    max_acceleration: 1.0  # Default max acceleration in mm/s^2

