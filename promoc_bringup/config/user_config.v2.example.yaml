# ProMOC User Configuration v2
#
# Release N+1 canonical keys:
# - runtime.mode: hardware
# - measurement.operator
# - measurement.base_path
#
# Copy this file to `user_config.yaml` and adjust the values for the local user.
# MTF exports will be written below:
#   <measurement.base_path>/<measurement.operator>/mtf_messungen/<run_id>/

runtime:
  mode: hardware

measurement:
  operator: YourName
  base_path: ~/Dokumente/Messungen

camera:
  pixel_size_um: 2.40

autofocus:
  refinement_samples: 51
  min_step_mm: 0.01
  refinement_shrink_factor: 0.25

fly_over:
  refinement_mode: 0
  refinement_strategy: linear

mtf:
  profile: default
  debug_export_dir: ""

measurement_conditions:
  coaxial_light_voltage: 0.0
  coaxial_light_current: 0.0
  camera_objective: unknown
  notes: ""
