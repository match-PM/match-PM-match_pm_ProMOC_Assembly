[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
  "build",
  "install",
  "log",
  ".venv",
  "local_libs",
  # Vendor-heavy and non-runtime areas outside active lint scope
  "camera_nodes/camera_nodes/domain/algorithms",
  "camera_nodes/camera_nodes/drivers",
  "camera_nodes/test/test_autofocus_benchmark.py",
  "linear_axis_nodes/linear_axis_nodes/drivers",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
pythonpath = ["promoc_core", "camera_nodes", "linear_axis_nodes", "promoc_bringup"]
