# Autofokus Parameter
# ==================

# Grob-Suche (Linear Scan)
scan_start: 0.0          # Start-Position [mm]
scan_end: 50.0           # End-Position [mm]
coarse_step: 1.0         # Schrittweite [mm]

# Fein-Suche (Golden Section)
fine_tolerance: 0.005    # Abbruch-Toleranz [mm] = 5µm
fine_search_range: 1.0   # Bereich um Grob-Maximum [mm]

# Timing
settle_time: 0.5         # Wartezeit nach Bewegung [s]
startup_delay: 2.0       # Verzögerung vor Auto-Start [s]

# ROI (Region of Interest)
roi_size: 250            # Halbe Kantenlänge [px]

# ROS2 Topics
image_topic: "/promoc/assembly_camera/stream0/image_raw"
stage_topic: "/lts300/move_to"

# ProMOC Integration
use_promoc_services: false
axis_service_prefix: "/lts300_z_axis"

# Auto-Start
auto_start: false        # Bei true: startet automatisch nach startup_delay
