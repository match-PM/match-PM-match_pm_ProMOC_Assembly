name: check

on:
  pull_request:
  push:
    branches:
      - cs_development
      - main
      - master

jobs:
  check:
    runs-on: ubuntu-22.04
    env:
      ROS_DISTRO: humble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt numpy

      - name: Run lint, unit, and N+1 contract checks
        run: make check
